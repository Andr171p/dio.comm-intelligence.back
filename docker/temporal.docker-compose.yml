x-temporal-sql: &temporal-sql
  SQL_PLUGIN: postgres12
  SQL_HOST: temporal-postgres
  SQL_PORT: 5432
  SQL_USER: temporal
  SQL_PASSWORD: temporal

services:
  temporal-postgres:
    image: postgres:18.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Одноразовый контейнер: создаёт БД и накатывает схемы Temporal (идемпотентно).
  temporal-schema:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.3}
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment: *temporal-sql
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        schema=/etc/temporal/schema/postgresql/v12
        temporal-sql-tool --quiet --db temporal create
        temporal-sql-tool --db temporal setup-schema -v 0.0
        temporal-sql-tool --db temporal update-schema -d $$schema/temporal/versioned
        temporal-sql-tool --quiet --db temporal_visibility create
        temporal-sql-tool --db temporal_visibility setup-schema -v 0.0
        temporal-sql-tool --db temporal_visibility update-schema -d $$schema/visibility/versioned

  temporal:
    image: temporalio/server:${TEMPORAL_VERSION:-1.31.3}
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    ports:
      - "${TEMPORAL_PORT:-7233}:7233"
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DYNAMIC_CONFIG_FILE_PATH: /etc/temporal/dynamicconfig.yaml
    volumes:
      - ./temporal/dynamicconfig.yaml:/etc/temporal/dynamicconfig.yaml:ro

  # Одноразовый контейнер: ждёт сервер и создаёт namespace приложения.
  temporal-namespace:
    image: temporalio/admin-tools:${TEMPORAL_VERSION:-1.31.3}
    depends_on:
      - temporal
    environment:
      # passthrough: gRPC dns-резолвер CLI зависает на docker DNS
      TEMPORAL_ADDRESS: passthrough:///temporal:7233
      NAMESPACE: ${TEMPORAL_NAMESPACE:-default}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        until temporal operator cluster health >/dev/null 2>&1; do sleep 2; done
        temporal operator namespace describe -n "$$NAMESPACE" >/dev/null 2>&1 ||
          temporal operator namespace create -n "$$NAMESPACE" --retention 72h

  temporal-ui:
    image: temporalio/ui:${TEMPORAL_UI_VERSION:-2.54.1}
    restart: unless-stopped
    depends_on:
      - temporal
    ports:
      - "${TEMPORAL_UI_PORT:-8088}:8080"
    environment:
      TEMPORAL_ADDRESS: temporal:7233

volumes:
  temporal_postgres_data:
    name: storage-temporal-postgres-data
